name = "yt-digest-worker"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[[d1_databases]]
binding = "DB"
database_name = "yt-digest"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "yt-digest-transcripts"
